{% extends "base.html" %}
{% block title %}Entrar · Spa WhatsApp{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-10">
  <h1 class="text-xl font-bold mb-1">Iniciar sesión</h1>
  <p class="text-sm text-slate-500 mb-4">Acceso para operadores y administradores.</p>
  <form method="post" action="/login" class="space-y-3">
    <label class="block">
      <span class="text-sm text-slate-600">Email</span>
      <input name="email" type="email" required class="w-full border rounded px-3 py-2 mt-1">
    </label>
    <label class="block">
      <span class="text-sm text-slate-600">Contraseña</span>
      <input name="password" type="password" required class="w-full border rounded px-3 py-2 mt-1">
    </label>
    <button class="w-full bg-teal-600 text-white rounded px-3 py-2 hover:bg-teal-700">Entrar</button>
  </form>
</div>
{% endblock %}
