[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spa-whatsapp"
version = "0.1.0"
description = "Automatizacion WhatsApp para spa: multi-agente (humanos + IA), citas y recordatorios. Twilio + PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "twilio>=9.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "psycopg2-binary>=2.9",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.120", "google-auth>=2.28"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosmtpd>=1.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
