[alembic]
# Migraciones async (asyncpg) sobre el mismo PostgreSQL de la app.
script_location = app/alembic
prepend_sys_path = .
# Sobrescrito por env.py desde app.config.settings -> fuente unica de verdad (DRY).
sqlalchemy.url = postgresql+asyncpg://spa:spa_secret@localhost:5432/spa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
